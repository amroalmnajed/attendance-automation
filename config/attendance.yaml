core:
  app:
    env: dev                        # dev | prod
    timezone: Africa/Cairo
    log_level: INFO
    dry_run_default: false          # set false only after go-live checklist passes

  auth:
    credentials_env: GOOGLE_APPLICATION_CREDENTIALS  # unset on Cloud Run (attached SA)
    secrets_backend: env            # env | gcp_secret_manager

  notify:
    channel: log                    # email | telegram | log
    recipients_env: NOTIFY_TO
    include_student_names: false

  retention:
    image_days: 30
    flagged_image_days_after_resolve: 30
    audit_log: keep

attendance:
  ingest:
    channel: cli                    # google_form_drive | drive_folder | telegram | cli
    poll_interval_s: 300
    form_responses_sheet_id_env: INGEST_SHEET_ID
    inbox_folder_id_env: INBOX_FOLDER_ID
    fields:
      course: Course
      session: Session
      type: Type
      photo: Photo

    # Paste-names flow (bot): "Ahmed Ali | L", "Sara - absent", "Omar, Late" ...
    # always   = always ask "Does this look right?" after the preview
    # on_issues = ask only when a mark is not recognised (default)
    # never    = skip the preview entirely
    names_preview: on_issues

    # Several photos for ONE upload (a Telegram album, or photos sent in quick succession).
    multi_photo:
      enabled: true
      max_photos: 6
      append_window_s: 120          # a photo sent within this many seconds joins the open upload

  # "Mark N absent?" button after an upload. crash and main ONLY: g9 / g10 can never be
  # offered, even if listed here. Only EMPTY cells are written (overwrite: refuse still applies),
  # real writes are audited (so /revert works) and a dry-run upload only previews.
  # Bot authorized users. IDs here are added to the AUTHORIZED_TELEGRAM_IDS env var
  # (comma-separated). If NO authorized user is configured, everyone is allowed.
  authorized:
    telegram_ids: []

  # Feature 12: missing-attendance reminders. OFF unless enabled. Needs python-telegram-bot[job-queue].
  # Uses core.app.timezone. A reminder is sent once per expected class if no upload is recorded for that
  # course on that date (counts come from the upload history, not from Google Sheets). Text has no names.
  reminders:
    enabled: true
    grace_minutes: 60               # wait this long after the class end time before reminding
    window_hours: 12                # stop trying this long after the class end time
    check_every_minutes: 10
    recipients: both                # admin | teacher | both
    schedule: # e.g.  crash: [{day: mon, time: "18:00"}, {day: thu, time: "18:00"}]
  reminders:
    enabled: true
    grace_minutes: 60
    window_hours: 12
    check_every_minutes: 10
    recipients: both
    schedule:
      g10:
        - {day: sat, time: "22:00"}
        - {day: sun, time: "22:00"}
        - {day: mon, time: "22:00"}
        - {day: tue, time: "22:00"}
        - {day: wed, time: "22:00"}
        - {day: thu, time: "22:00"}
      g9:
        - {day: fri, time: "22:00"}
        - {day: sat, time: "22:00"}    
  # Feature 13: alerts to ADMINS (never teachers) when Gemini/Sheets keep failing or review items wait too long.
  # Counts only, no names. One alert per kind per cooldown. Real uploads only (dry runs record nothing).
  # The review-age check needs the scheduler; Gemini/Sheets alerts do not. Admin command: /health
  health:
    enabled: true
    window_minutes: 60              # failures are counted over this rolling window
    gemini_threshold: 5             # failed / rate-limited Gemini calls in the window (one per kind per read)
    sheets_threshold: 3             # failed Sheets writes in the window
    review_max_age_days: 3          # alert when an upload still has pending review items after this long
    cooldown_minutes: 120           # minimum time between two alerts of the same kind

  # Feature 6: post-write summary shows Present/Late/Absent/Review for this session and the
  # previous session of the same course; warns when Present+Late fell by drop_threshold_pct or more.
  summary_compare:
    enabled: true
    drop_threshold_pct: 30
    min_previous: 5                 # ignore the comparison when the previous session had fewer attendees

  absent_button:
    enabled: true
    courses: [crash, main]
    min_matched: 3                  # never offer on a near-empty / unreadable upload
    block_when_pending_review: true # tap is refused while this upload still has review items

  ocr:
    provider: gemini                # gemini | mock
    model: gemini-3.5-flash         # Downgraded to 3.5 to bypass 429 quota exhaustion on 3.8
    passes: 2
    timeout_s: 60                   # per-request Gemini HTTP timeout
    max_attempts: 3                 # same-model retries for timeouts/5xx (429 → next model)
    second_provider: null           # e.g. mock for testing independent-error second pass
    fallback_to_tesseract: true
    tesseract_lang: eng
    # Feature 9: what the 2nd pass reads. Only used when passes: 2 (passes: 1 = single read, always).
    #   full           = every row is read twice and merged (the original behaviour, default)
    #   low_confidence = read everything once; re-read ONLY when some rows are below min_confidence
    #                    (or, with send_roster_to_provider, have no roster match) and merge into just those rows.
    #                    A clean sheet then costs ONE Gemini call instead of two.
    second_pass:
      mode: full                    # full | low_confidence
      model: null                   # optional: a different Gemini model for the extra read (null = same model)
      provider: null                # optional: a different provider for the extra read (gemini | mock)
      include_unmatched: true       # low_confidence only: also re-read rows the model could not match to the roster
    min_confidence: 0.75            # rows below this threshold → OCR_LOW_CONFIDENCE review
    send_roster_to_provider: true   # let the model see the real roster and propose a match
                                     # itself instead of guessing a transliteration blind —
                                     # this is what actually resolves ambiguous/partial names.
    preprocess:
      orient: true
      deskew: true
      contrast: mild
      max_side_px: 2000
      strip_exif: true
    retry_preprocessing: false         # T8: retry OCR with CLAHE+adaptive_thresh if avg confidence < min_confidence

  match:
    t_high: 90                      # auto-accept threshold; must have score >= 90 AND margin >= 10
    margin: 10
    review_floor: 60
    min_tokens_for_auto: 1
    # Soft accept lane (DISABLED until `python tests/eval_matcher.py` confirms FAR=0%):
    # accept when score >= t_soft AND lead >= margin_strong, even if score < t_high.
    t_soft: null                    # e.g. 80
    margin_strong: 20
    # Learned aliases: reviewer decisions become future auto-accepts (per course).
    learn_aliases: true
    aliases_file: config/learned_aliases.json
    alias_min_confirmations: 1      # raise to 2 to require two identical confirmations
    # Feature 15: spelling differences seen in reviewer decisions are collected as SUGGESTIONS here
    # (never applied automatically). Review/approve them with:  aliases variants review
    variant_learning:
      enabled: true
      suggestions_file: config/variant_suggestions.json
      min_similarity: 0.7           # how alike two spellings must be to be suggested as the same name
    alias_stale_days: 90            # aliases not used / not confirmed for this long are flagged as old
    weights:
      token_sort: 0.5           # equal weighting: composite = 0.5*sort + 0.5*set
      token_set: 0.5            # 0.9/0.1 caused MATCH_AMBIGUOUS on all shared-prefix names
    variants_file: config/name_variants.yaml
    hidden_rows: exclude            # exclude | include
    skip_row_patterns:
      - '\(Ref\)\s*$'               # row label "AAAAAAAAAAAAAAAA (Ref)" in all sheets
    missing_student_policy: report  # ignore | report | mark_absent

  write:
    session_check: strict           # strict: SESSION_MISMATCH blocks the whole upload
    overwrite: refuse               # refuse | force (force only via --force CLI flag)
    values_source: sheet            # read dropdowns live; config values only for comparison
    retry:
      max_attempts: 6
      base_s: 1.0
      cap_s: 32.0
      jitter: true

  review:
    store: local_json               # gcs_json | local_json
    local_dir: review_queue
    mirror_sheet_id_env: OPS_SHEET_ID
    tab: Review

  # Zoom CSV and API integration for automated attendance
  zoom_csv:
    enabled: true
    meeting_id_mappings:
      "81795786552": main
      "83570905451": g10
      "81887392957": crash
      "82572049402": g9
    teacher_name: "Amro"
    teacher_fuzzy_match_threshold: 80
    teacher_join_buffer_minutes: 5
    late_threshold_minutes: 15
    min_duration_minutes: 45
    early_leave_threshold_minutes: 20
    duplicate_handling: "sum_duration"
    auto_session_type: true
    auto_archive_csv: true
    archive_folder: "csv_archive"
    auto_learn_meeting_ids: true
    csv_strict_validation: true
    log_folder: "logs/zoom_csv"
    zoom_api:
      account_id_env: ZOOM_ACCOUNT_ID
      client_id_env: ZOOM_CLIENT_ID
      client_secret_env: ZOOM_CLIENT_SECRET
      token_url: "https://zoom.us/oauth/token"
      api_base_url: "https://api.zoom.us/v2"

    # Matcher overrides for the Zoom path only.
    # Zoom display names are self-typed (confidence=1.0) but are typically shorter than
    # full roster names (e.g. "Adam Wafa" vs "Adam Mohammed Wafa"), so the fuzzy score
    # ceiling is ~85–88 even for an obvious match.  We relax t_high and add a soft-accept
    # lane for clear winners that fall just below the primary threshold.
    #
    # Primary lane:  score >= t_high (80) AND margin >= margin (8)
    # Soft lane:     score >= t_soft (68) AND margin >= margin_strong (22)
    #                — catches partial-name matches like "Omar Morad" → roster row
    #
    # These values were calibrated against the G10/CRASH/MAIN production logs.
    # Run  python tests/eval_matcher.py  to verify FAR stays at 0% before changing them.
    match_overrides:
      t_high: 76       # Zoom names are self-typed; relax from the OCR default of 90
      margin: 8        # slightly relaxed from 10
      t_soft: 68       # soft-accept lane for partial names (e.g. "Omar Morad")
      margin_strong: 20  # soft lane requires a bigger lead to compensate for lower score

  # Canonical attendance values — these are compared (case-insensitively) against live dropdowns.
  attendance_values:
    Present: Present
    Late: Late
    Not complete: Not complete
    Absent: Absent

  courses:
    crash:
      sheet_id_env: CRASH_SHEET_ID
      tab: Crash-Attendance
      layout: single                # single | typed_pair
      name_col: A
      header_row: 1                 # "Session N" in row 1
      session_header_pattern: '^Session (\d+)$'
      date_row: 2                   # text date e.g. "Saturday, July 4"
      first_student_row: 5
      hidden_rows: [9, 19]
      hidden_cols: [B, C]
      allowed_values: [Present, Late, Not complete, Absent]

    main:
      sheet_id_env: MAIN_SHEET_ID
      tab: Main-Attendance
      layout: single
      name_col: A
      header_row: 1                 # "Session N" confirmed by discover_sheets.py
      session_header_pattern: '^Session (\d+)$'
      date_row: 2
      first_student_row: 5
      hidden_cols: [B, C]
      allowed_values: [Present, Late, Not complete, Absent]

    g10:
      sheet_id_env: G10_SHEET_ID
      tab: Main-Attendance
      layout: typed_pair            # type col left of "S(x) Attendance"
      name_col: A
      header_row: 1                 # "S1", "S1 Attendance", ...
      session_header_pattern: '^S(\d+)$'
      attendance_header_pattern: '^S(\d+) Attendance$'
      first_student_row: 5
      allowed_values: [Present, Late, Not complete, Absent]
      types:
        # Odd sessions (S1, S3, S5...) — compared with live sheet; mismatch = CONFIG_SHEET_DRIFT
        odd:
          - "Saturday - Center"
          - "Saturday - Online"
          - "Sunday- Center"         # exact sheet string (no space before Center)
          - "Sunday- Online"          # exact sheet string
          - "Monday - Online"
        # Even sessions (S2, S4, S6...)
        even:
          - "Tuesday - Center"
          - "Tuesday  - Online"       # exact sheet string (double-space)
          - "Wednesday - Online"
          - "Thursday - Center"
          - "Thursday - Online"

    g9:
      sheet_id_env: G9_SHEET_ID
      tab: Main-Attendance
      layout: typed_pair
      name_col: A
      header_row: 1
      session_header_pattern: '^S(\d+)$'
      attendance_header_pattern: '^S(\d+) Attendance$'
      first_student_row: 5
      allowed_values: [Present, Late, Not complete, Absent]
      types:
        any:
          - "Friday - Center"
          - "Friday - Online"
          - "Saturday - Center"
          - "Saturday - Online"
