[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", ".temp", "review_images", "review_queue", "logs"]

[tool.ruff.lint]
# Conservative on purpose: syntax errors, undefined names, unused/duplicate imports in app code.
select = ["E9", "E722", "F63", "F7", "F82", "F401", "F811", "B"]

ignore = [
    "B007",  # TODO Part 2: unused-loop-control-variable
    "B017",  # TODO Part 2: assert-raises-exception
    "B023",  # TODO Part 2: function-uses-loop-variable
    "B904",  # TODO Part 2: raise-without-from-inside-except
    "B905",  # TODO Part 2: zip-without-explicit-strict
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401"] # Ignore re-imported fixtures and re-defined fixture names in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest_cache"
tmp_path_retention_count = 0
filterwarnings = [
    "ignore:.*per_message=False.*:telegram.warnings.PTBUserWarning",
    "ignore:'_UnionGenericAlias' is deprecated.*:DeprecationWarning",
]